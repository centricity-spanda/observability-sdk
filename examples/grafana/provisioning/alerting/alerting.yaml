apiVersion: 1

contactPoints:
  - orgId: 1
    name: grafana-default-email
    receivers:
      - uid: default-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: "spanda@centricity.co.in"

  - orgId: 1
    name: order-service-email
    receivers:
      - uid: order-service-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: "order-team@centricity.co.in"

  - orgId: 1
    name: payment-service-email
    receivers:
      - uid: payment-service-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: "payment-team@centricity.co.in"

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: ["alertname", "service"]
    group_wait: 30s
    group_interval: 30s
    repeat_interval: 4h
    routes:
      - receiver: order-service-email
        matchers:
          - service = order-service
      - receiver: payment-service-email
        matchers:
          - service = payment-service

groups:
  # ── Service Health Alerts ─────────────────────────────────────────────────
  - orgId: 1
    name: service-health-alerts
    folder: Observability
    interval: 1m
    rules:
      - uid: high-error-rate
        title: High Error Rate
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "High error rate on service"
          description: "Error rate is above 5% for at least 1 minute."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: '(sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service)) > 0.05 and sum(rate(http_requests_total[5m])) by (service) > 0.1'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: high-p99-latency
        title: High P99 Latency
        condition: A
        for: 2m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "P99 latency is very high"
          description: "P99 request duration is above 2 seconds for at least 2 minutes."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2 and sum(rate(http_requests_total[5m])) by (service) > 0.1'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: high-in-flight-requests
        title: High In-Flight Requests
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Too many requests in flight"
          description: "In-flight requests are above 50 for at least 1 minute."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: "sum(http_requests_in_flight) by (service) > 50"
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: large-request-payload
        title: Large Request Payload
        condition: A
        for: 30s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Very large request payload detected"
          description: "P99 request size is above 1MB."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'histogram_quantile(0.99, sum(rate(http_request_size_bytes_bucket[5m])) by (le, service)) > 1048576 and sum(rate(http_requests_total[5m])) by (service) > 0.1'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: kafka-producer-failures
        title: Kafka Producer Failures
        condition: A
        for: 1m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Kafka producer is reporting errors"
          description: "At least one Kafka producer error in the last minute."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'sum(rate(kafka_producer_messages_total{status="error"}[5m])) by (service) > 0.01'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

  # ── Platform Health Alerts (Meta-Monitoring) ──────────────────────────────
  - orgId: 1
    name: platform-health-alerts
    folder: Observability
    interval: 1m
    rules:
      - uid: vector-agent-errors
        title: Vector Agent Errors
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Vector Agent is reporting errors — log pipeline may be degraded"
          description: "Vector Agent has had errors for 5+ minutes. Check Vector logs."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'sum(rate(vector_component_errors_total[5m])) > 0'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: otel-collector-drops
        title: OTel Collector Dropping Data
        condition: A
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "OTel Collector is dropping spans or metrics — data loss occurring"
          description: "OTel Collector has been dropping data for 5+ minutes. Check memory limits."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'sum(rate(otelcol_processor_dropped_spans[5m])) + sum(rate(otelcol_processor_dropped_metric_points[5m])) > 0'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: loki-streams-nearing-limit
        title: Loki Active Streams Nearing Limit
        condition: A
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Loki active streams approaching configured limit (10,000)"
          description: "Active streams above 8,000 — consider reducing label cardinality."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'sum(loki_ingester_streams_created_total - loki_ingester_streams_removed_total) > 8000'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: mimir-series-nearing-limit
        title: Mimir Active Series Nearing Limit
        condition: A
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "Mimir active series approaching configured limit (1,000,000)"
          description: "Active series above 800,000 — consider metric cleanup."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              refId: A
              datasource:
                type: prometheus
                uid: mimir
              expr: 'sum(cortex_ingester_active_series) > 800000'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
