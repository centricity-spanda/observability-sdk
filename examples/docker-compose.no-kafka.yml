# ═══════════════════════════════════════════════════════════════════════════════
# PHASE 1 — NO KAFKA (Same pipeline, just without Kafka in the middle)
#
# Logs:    App → Vector Agent → Vector Aggregator → Loki
# Traces:  App → OTel Agent   → OTel Gateway      → Tempo
# Metrics: App → OTel Agent   → OTel Gateway      → Mimir
#
# Run: docker-compose -f docker-compose.no-kafka.yml up -d --build
# ═══════════════════════════════════════════════════════════════════════════════
version: '3.8'

services:
  # ═══ STORAGE LAYER ═══════════════════════════════════════════════════════════

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.3.0
    container_name: tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4417:4317"    # OTLP gRPC (from OTel Gateway)
      - "4418:4318"    # OTLP HTTP

  mimir:
    image: grafana/mimir:2.12.0
    container_name: mimir
    command: ["-config.file=/etc/mimir/mimir-config.yaml", "-target=all"]
    volumes:
      - ./mimir/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - mimir-data:/var/mimir
    ports:
      - "9009:9009"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9009/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══ AGGREGATION LAYER ══════════════════════════════════════════════════════

  # Vector Aggregator — receives from Vector Agent(s), pushes to Loki
  vector-aggregator:
    image: timberio/vector:0.34.1-alpine
    container_name: vector-aggregator
    volumes:
      - ./vector/vector-aggregator-direct.yaml:/etc/vector/vector.yaml:ro
      - vector-agg-data:/var/lib/vector
    environment:
      VECTOR_LOG: info
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "8687:8687"    # Vector Aggregator API
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8687/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OTel Gateway — receives OTLP from OTel Agent(s), pushes to Tempo + Mimir
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: otel-gateway
    volumes:
      - ./otel-collector/gateway-direct.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4327:4317"     # OTLP gRPC (OTel Agents send here)
      - "4328:4318"     # OTLP HTTP
      - "8889:8889"     # Internal metrics
      - "13133:13133"   # Health check
    depends_on:
      - tempo
      - mimir

  # ═══ COLLECTION LAYER (per node in production) ═════════════════════════════

  # Vector Agent — reads Docker logs, applies PII masking + throttle,
  #                pushes to Vector Aggregator
  vector-agent:
    image: timberio/vector:0.34.1-alpine
    container_name: vector-agent
    volumes:
      - ./vector/vector-direct.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-agent-data:/var/lib/vector
    environment:
      VECTOR_LOG: info
    depends_on:
      - vector-aggregator
    ports:
      - "8686:8686"     # Vector Agent API
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8686/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OTel Agent — receives OTLP from apps, forwards to OTel Gateway
  otel-agent:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: otel-agent
    volumes:
      - ./otel-collector/agent-direct.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "8888:8888"     # Internal metrics
    depends_on:
      - otel-gateway

  # ═══ VISUALIZATION ══════════════════════════════════════════════════════════

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
      mimir:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana-data:/var/lib/grafana

  # ═══ APPLICATION SERVICES ═══════════════════════════════════════════════════

  go-service:
    build:
      context: ../
      dockerfile: examples/go-http-service/Dockerfile
    container_name: go-service
    ports:
      - "8088:8088"
    environment:
      SERVICE_NAME: go-service
      SERVICE_VERSION: "1.0.0"
      ENVIRONMENT: development
      SERVICE_TEAM: platform
      LOG_LEVEL: info
      LOG_CONSOLE_ENABLED: "true"
      LOG_KAFKA_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - otel-agent

  python-service:
    build:
      context: ../
      dockerfile: examples/python-fastapi-service/Dockerfile
    container_name: python-service
    ports:
      - "8089:8081"
    environment:
      SERVICE_NAME: python-service
      SERVICE_VERSION: "1.0.0"
      ENVIRONMENT: development
      SERVICE_TEAM: platform
      LOG_LEVEL: info
      LOG_CONSOLE_ENABLED: "true"
      LOG_KAFKA_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      PORT: "8081"
    depends_on:
      - otel-agent

  dotnet-service:
    build:
      context: ../
      dockerfile: examples/dotnet-service/Dockerfile
    container_name: dotnet-service
    ports:
      - "8091:8091"
    environment:
      SERVICE_NAME: dotnet-service
      SERVICE_VERSION: "1.0.0"
      ENVIRONMENT: development
      SERVICE_TEAM: platform
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-agent:4317
      ASPNETCORE_URLS: http://+:8091
    depends_on:
      - otel-agent

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
  vector-agent-data:
  vector-agg-data:
